[project]
name = "govbudget"
version = "0.1.0"
description = "Government spending intelligence — federal data backbone"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "duckdb>=1.1",
    "dbt-duckdb>=1.9",
    "psycopg[binary]>=3.2",
    "pypdf>=5.0",
    "openpyxl>=3.1",
    "selectolax>=0.3",
    "pdfplumber>=0.11",
    "anthropic>=0.109",
]

[dependency-groups]
dev = [
    "playwright>=1.61.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/govbudget"]

[tool.pytest.ini_options]
testpaths = ["tests"]
