# Fiscal Receipts Search Evaluation Cases
#
# Each case has:
#   query:            the user-typed string
#   expect_url_top3:  the expected URL must appear in top-3 results (tier: quick)
#   expect_url_top5:  the expected URL must appear in top-5 results (tier: deep)
#   tier:             quick | deep
#   note:             human-readable description
#
# Gate requirement: ≥90% overall, 100% of typo cases.
# Tier-1 (quick) cases use expect_url_top3; Tier-2 (deep) use expect_url_top5.

cases:

  # ── Exact pe_bli match ──────────────────────────────────────────────────────
  - query: "0601101E"
    expect_url_top3: "/program/0601101E/"
    tier: quick
    note: "Exact PE/BLI code for DARPA Defense Research Sciences"

  - query: "0603467E"
    expect_url_top3: "/program/0603467E/"
    tier: quick
    note: "Exact pe_bli for DARPA Advanced Technology Development"

  - query: "0606301D8Z"
    expect_url_top3: "/program/0606301D8Z/"
    tier: quick
    note: "Exact pe_bli for the heaviest SSG page (Aviation Safety Technologies)"

  # ── Program title queries ───────────────────────────────────────────────────
  - query: "defense research sciences darpa"
    expect_url_top3: "/program/0601101E/"
    tier: quick
    note: "DARPA basic research program. Since the Phase 5G Army/AF/SF archive round, every military department carries its own full-tier 'Defense Research Sciences' PE (0601102A/F, 0601153N, 0601102SF) — five identical titles that tie on relevance, so the query names the service (darpa) to disambiguate the intended one."

  - query: "sensor technology"
    expect_url_top3: "/program/0603767E/"
    tier: quick
    note: "DARPA Sensor Technology program title"

  - query: "tactical technology"
    expect_url_top3: "/program/0602702E/"
    tier: quick
    note: "DARPA Tactical Technology program title"

  - query: "network centric warfare"
    expect_url_top3: "/program/0603766E/"
    tier: quick
    note: "DARPA Network-Centric Warfare Technology program"

  - query: "advanced technology development"
    expect_url_top3: "/program/0603467E/"
    tier: quick
    note: "DARPA Advanced Technology Development program"

  - query: "aviation safety"
    expect_url_top3: "/program/0606301D8Z/"
    tier: quick
    note: "OSD Aviation Safety Technologies program"

  - query: "electronics technology"
    expect_url_top3: "/program/0602716E/"
    tier: quick
    note: "DARPA Electronics Technology program"

  # ── Agency queries ──────────────────────────────────────────────────────────
  - query: "darpa"
    expect_url_top3: "/agency/DARPA/"
    tier: quick
    note: "Exact agency acronym lookup"

  - query: "SOCOM"
    expect_url_top3: "/agency/SOCOM/"
    tier: quick
    note: "Special Operations Command agency lookup"

  - query: "MDA"
    expect_url_top3: "/agency/MDA/"
    tier: quick
    note: "Missile Defense Agency lookup"

  # ── Company queries ─────────────────────────────────────────────────────────
  - query: "lockheed martin"
    expect_url_top3: "/company/lockheed-martin/"
    tier: quick
    note: "Top defense contractor exact name"

  - query: "boeing"
    expect_url_top3: "/company/boeing/"
    tier: quick
    note: "Boeing company lookup"

  - query: "raytheon"
    expect_url_top3: "/company/raytheon/"
    tier: quick
    note: "Raytheon company lookup"

  - query: "general dynamics"
    expect_url_top3: "/company/general-dynamics/"
    tier: quick
    note: "General Dynamics company lookup"

  - query: "northrop grumman"
    expect_url_top3: "/company/northrop-grumman/"
    tier: quick
    note: "Northrop Grumman company lookup"

  # ── Typo cases (100% required by gate) ─────────────────────────────────────
  - query: "lockeed"
    expect_url_top3: "/company/lockheed-martin/"
    tier: quick
    note: "Typo: 'lockeed' → lockheed-martin (1 missing char, fuzzy 0.2)"

  - query: "darppa"
    expect_url_top3: "/agency/DARPA/"
    tier: quick
    note: "Typo: 'darppa' → DARPA (1 extra char)"

  - query: "boeng"
    expect_url_top3: "/company/boeing/"
    tier: quick
    note: "Typo: 'boeng' → boeing (1 missing char)"

  # ── Alias cases (data-seeds/search_aliases.csv — Task 7a) ──────────────────
  - query: "JASSM"
    expect_url_top3: "/program/0603000D8Z/"
    tier: quick
    note: "Alias: JASSM → Joint Munitions Advanced Technology (term absent from program title; cited via LDA filing)"

  - query: "Golden Dome"
    expect_url_top3: "/program/0603892C/"
    tier: quick
    note: "Alias: Golden Dome → AEGIS BMD (J-book: 'SM-3 Block IIA is required for Golden Dome for America')"

  - query: "Armed Overwatch"
    expect_url_top3: "/program/1160403BB/"
    tier: quick
    note: "Alias: Armed Overwatch → SOCOM Aviation Systems (project inside the PE; term absent from title)"

  - query: "Ghostrider"
    expect_url_top3: "/program/2012C130J/"
    tier: quick
    note: "Alias: Ghostrider → AC/MC-130J (AC-130J Ghostrider nickname from line-item description)"

  - query: "drones"
    expect_url_top3: "/program/0608776D8Z/"
    tier: quick
    note: "Alias: drones → DIU Fielding (congressional add 'AI ISR Drones')"

  # ── P1-4: alphanumeric normalization + ranking blend + program aliases ─────
  # (PM review Sprint 2 Task 1 — the PM's exact repros)
  - query: "F35"
    expect_url_top3: "/program/ATA000/"
    tier: quick
    note: "PM repro: 'F35' must find F-35 (ATA000, the procurement flagship) — pre-fix the Programs tier returned RC-135/C-135"

  - query: "B21"
    expect_url_top3: "/program/B02100/"
    tier: quick
    note: "Alphanumeric normalization: 'B21' → B-21 Raider procurement line"

  - query: "Sentinel"
    expect_url_top3: "/program/0605238F/"
    tier: quick
    note: "PM repro: alias + magnitude blend — GBSD EMD ($4.15B FY26, the ICBM program named Sentinel/LGM-35A) ranks above the minor Sentinel Mods line"

  - query: "Sentinel Mods"
    expect_url_top3: "/program/0125WK5057/"
    tier: quick
    note: "Regression: an exact unique program name still beats a bigger program — magnitude only breaks near-ties, never swamps exact name matches"

  - query: "JSF"
    expect_url_top3: "/program/ATA000/"
    tier: quick
    note: "Alias: JSF → F-35 (ATA000); the ATA000 payload names 'Joint Strike Fighter'"

  # ── Deep tier (pagefind narrative search) ──────────────────────────────────
  - query: "Perceptually-Enabled Task Guidance augmented reality"
    expect_url_top5: "/program/0601101E/"
    tier: deep
    note: "Deep search: narrative phrase from 0601101E DARPA Defense Research Sciences (PTG program)"

  - query: "nodes will redirect correct selectively"
    expect_url_top5: "/program/0602702E/"
    tier: deep
    note: "Deep search: narrative phrase from 0602702E DARPA Tactical Technology"

  - query: "requests for communication services MINC"
    expect_url_top5: "/program/0603760E/"
    tier: deep
    note: "Deep search: narrative phrase from 0603760E DARPA Command Control Communications (MINC program)"

  # ── Feed/district/filing navigation cases (Task 9, plan decision 4) ─────────
  # District pages are in the quick-index (kind:'district'); one entry per
  # district from fct_district_programs, plus the /district/ index page.
  # Quick-index navigation to /feed/ works via a site-nav alias.
  - query: "anomaly feed"
    expect_url_top3: "/feed/"
    tier: quick
    note: "Feed page navigation — quick-index entry"

  - query: "congressional districts defense"
    expect_url_top3: "/district/"
    tier: quick
    note: "District index navigation"

  - query: "CO-05"
    expect_url_top3: "/district/CO-05/"
    tier: quick
    note: "District direct lookup by code"
