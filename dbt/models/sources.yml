version: 2
sources:
  - name: lake
    schema: main
    tables:
      - name: contracts
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/contracts/*/*.parquet', hive_partitioning=true, union_by_name=true)"
      - name: assistance
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/assistance/*/*.parquet', hive_partitioning=true, union_by_name=true)"
      - name: subawards
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/subawards/*/*.parquet', hive_partitioning=true, union_by_name=true)"
      - name: mts_outlays
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/mts_outlays/*.parquet')"
      - name: jbook_budget_lines
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/jbooks/budget_lines.parquet')"
      - name: jbook_details
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/jbooks/details.parquet')"
      - name: jbook_narratives
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/jbooks/detail_narratives.parquet')"
      - name: jbook_awards
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/jbooks/budget_line_awards.parquet')"
      - name: entity_xwalk_src
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/entities/entity_xwalk.parquet')"
  - name: oversight
    schema: main
    tables:
      - name: improper_payments
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/oversight/improper_payments.parquet')"
      - name: high_risk
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/oversight/high_risk.parquet')"
  - name: states
    schema: main
    tables:
      - name: ca_budget
        description: "California budget lines from Open Fi$Cal per-department transaction files (all-varchar; FY2025)"
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/states/ca_budget.parquet')"
      - name: ca_checkbook
        description: "California Open Fi$Cal aggregated spend per department/category/year (all-varchar)"
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/states/ca_checkbook_agg.parquet')"
      - name: ct_checkbook
        description: "Connecticut OpenCheckbook aggregated spend per department/category/year from data.ct.gov Socrata (all-varchar; FY2019-2026)"
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/states/ct_checkbook_agg.parquet')"
      - name: state_population
        description: "US Census state population estimates (NST-EST2024); CA and CT included; all-varchar"
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/states/state_population.parquet')"
