version: 2
models:
  - name: entity_xwalk
    description: "Recipient UEI → family_key crosswalk, built by govbudget entity-graph over the contracts+assistance lake — the same union fct_award_transactions reads, so dim_entities.total_obligation is reproducible from the query every /company/ page publishes beside it. Unique on recipient_uei — any duplicate would fan-out fct_family_obligations_by_year and double-count award dollars. REBUILD IT WHENEVER A PARTITION LANDS: it is a derived parquet, and a stale one is silently wrong about the period the pages label rather than visibly broken (gate 23 leg d)."
    columns:
      - name: recipient_uei
        description: "SAM.gov Unique Entity Identifier for the recipient. Must be unique — duplicates cause fan-out double-counting in obligation aggregation."
        data_tests: [unique, not_null]
  - name: fct_award_transactions
    columns:
      - name: transaction_key
        data_tests: [unique, not_null]
  - name: dim_recipients
    columns:
      - name: recipient_uei
        data_tests: [unique, not_null]
  - name: fct_budget_trajectory
    description: "COMPONENT-grain budget trajectory. Grain: (pe_bli, organization) — one row per program element PER ORGANISATION that funds it, which for the three BLI codes shared across organisations is a part of the program, not the program. Anything published under a program's name must read fct_program_trajectory (ROADMAP backlog #37)."
    columns:
      - name: pe_bli
        data_tests: [not_null]
  - name: fct_program_trajectory
    description: "PROGRAM-grain budget trajectory (ROADMAP backlog #37). Grain: pe_bli — every component organisation summed, which is what `programs.json` and every /program/{pe_bli}/ surface publish. Change columns are recomputed from the summed endpoints, never summed themselves. assert_program_trajectory_component_sum pins every metric to the sum of its component rows."
    columns:
      - name: pe_bli
        data_tests: [unique, not_null]
        description: "Program element / budget line identifier. Unique — one trajectory per program."
      - name: n_org_components
        description: "How many (pe_bli, organization) rows this program's figures were summed from. 1 for 1,738 of 1,741 programs; >1 only for BLI codes shared across organisations."
  - name: dim_programs
    description: "PB2026-edition program dimension (R-2/P-40 detail universe). Grain: one row per pe_bli. fy2024_actual_millions is the PriorYear root-row sum over DISTINCT detail tuples (pe_bli, project_number, scenario, amount, xml_path) — dual-volume J-books embed the same XML in 2+ documents and the raw per-row sum double-counts (PM-review Sprint 1: 47 Army PEs at 2×; assert_dim_programs_detail_dedup + assert_dim_programs_dual_volume_dedup_pin guard it)."
    columns:
      - name: pe_bli
        data_tests: [unique, not_null]
        description: "Program element / budget line identifier. Unique — one program row per pe_bli."
  - name: dim_pe_titles
    description: "Canonical display title per pe_bli, resolved from titled detail rows in fct_budget_lines. Deterministic rule: largest fy_2024_actuals detail row's title; no-fy24/tie fallback is the alphabetically-first title. Single source for program-title resolution (feed exporter consumes this); covers every trajectory pe_bli, unlike dim_programs (R-2/P-40 only)."
    columns:
      - name: pe_bli
        data_tests: [unique, not_null]
        description: "Program element / budget line identifier. Unique — exactly one canonical title per pe_bli."
      - name: title
        data_tests: [not_null]
        description: "Canonical program title (detail-row title, never an R-1 rollup NULL)."
  - name: fct_program_concentration
    columns:
      - name: pe_bli
        data_tests: [not_null]
  - name: fct_agency_concentration
    columns:
      - name: awarding_sub_agency_name
        data_tests: [not_null]
  - name: fct_improper_exposure
    columns:
      - name: agency_code
        data_tests: [not_null]
      - name: derived_improper_amount_usd
        description: "Derived: outlays × improper rate from paymentaccuracy.gov page attributes; not an agency-reported dollar figure."
  - name: fct_state_budget
    description: "Typed California budget lines from Open Fi$Cal per-department transactions (FY2025). Grain: one row per (department, category, fund, fiscal_year) budget line."
    columns:
      - name: department
        data_tests: [not_null]
      - name: amount_usd
        description: "Line-item expenditure amount in USD (cast from varchar source)"
      - name: recomputed_dept_total_usd
        description: "Derived: sum of all line-item amount_usd values for this department/fiscal_year, recomputed from source rows for pipeline-integrity reconciliation."
  - name: fct_state_spend
    description: "Union of CA and CT checkbook aggregates, jurisdiction-tagged. Grain: one row per (jurisdiction, department, category, fiscal_year)."
    columns:
      - name: jurisdiction
        data_tests: [not_null]
      - name: amount_usd
        description: "Aggregated expenditure amount in USD for this (jurisdiction, department, category, fiscal_year)"
  - name: fct_influence
    description: "Lobbying disclosure amounts per (family_key, filing_year) from Senate LDA, joined with total contract obligations from dim_entities. Grain: one row per (family_key, filing_year). Lobbying amounts reflect statutory disclosures only; no causal relationship between lobbying and awards is stated or implied."
    columns:
      - name: family_key
        data_tests: [not_null]
        description: "Normalized family key from dim_entities (or raw LDA client_name if unmatched)."
      - name: filing_year
        data_tests: [not_null]
        description: "LDA filing year (calendar year of the report)."
      - name: lobbying_income_usd
        description: "Sum of income_usd from filings where an outside lobbying firm reported income from this client. Mutually exclusive with lobbying_expense_usd per filing."
      - name: lobbying_expense_usd
        description: "Sum of expenses_usd from in-house/self-filer filings. Mutually exclusive with lobbying_income_usd per filing."
      - name: lobbying_total_usd
        description: "Sum of lobbying_income_usd and lobbying_expense_usd; total lobbying outlay without double-counting (income and expenses are mutually exclusive per LDA filing)."
      - name: family_obligations_usd
        description: "Total federal contract obligations for this family from dim_entities (all years in the award lake). NON-ADDITIVE: this is a family-level constant repeated on every (family_key, filing_year) row — do NOT SUM across rows; use MAX or join dim_entities directly. Shown alongside lobbying for context; no directional relationship implied."
  - name: fct_program_lobbying
    description: "Program-mention rows from LDA activity descriptions matched against dim_programs. Grain: at most one row per (filing_uuid, pe_bli) — the #52 evidence-tier fix (2026-08) collects every matching term for a pair before emitting once, so matched_term/evidence_kind no longer fan a pair out into multiple rows. Matching is deterministic (PE-code literal / curated alias / >=2 distinct title tokens, word-boundary). Each row is citation-ready via filing_url. Presence is keyword co-occurrence with the filing's activity description — never a claim that the filing names the program (see docs/superpowers/ROADMAP.md item 52)."
    columns:
      - name: filing_uuid
        data_tests: [not_null]
        description: "LDA filing UUID; permanent identifier resolvable at lda.senate.gov."
      - name: pe_bli
        data_tests: [not_null]
        description: "Program element or budget line identifier matched from dim_programs."
      - name: matched_term
        description: "The evidence found in the filing description: the exact PE code, a curated alias, or the qualifying title tokens joined by '|' (multi_token). Preserved for transparency and audit — see evidence_kind for which tier applies."
      - name: evidence_kind
        data_tests: [not_null]
        description: "Which evidence tier qualified this row: 'pe_literal' (exact PE/BLI code), 'alias' (curated, human-verified alias), or 'multi_token' (>=2 distinct non-generic title tokens). A single common title word is never sufficient on its own (#52) — see dbt/tests/assert_program_mentions_evidence.sql."
      - name: filing_url
        description: "Direct URL to the LDA filing record at lda.senate.gov."
  - name: dim_lobbyists
    description: "One row per unique lobbyist name from LDA disclosures. revolving_door flag derived from non-empty, non-N/A covered_position (prior government service); reflects statutory disclosure only."
    columns:
      - name: name
        data_tests: [not_null, unique]
        description: "Lobbyist full name as disclosed in LDA filing."
      - name: covered_position
        description: "Most recently disclosed prior government position (statutory disclosure). Empty when not disclosed."
      - name: filings_count
        description: "Number of distinct filings in which this lobbyist appears."
      - name: revolving_door
        description: "True when covered_position is non-empty and not N/A — indicating disclosed prior executive or legislative branch service. Reflects the statutory LDA disclosure; no further inference."
  - name: fct_feed_events
    description: "Anomaly feed events for the /feed page. Four event types: yoy_swing (big YoY budget swings), zeroed_fy2026 (programs with FY2025 budget zeroed in FY2026), concentration_shift (HHI computed per program/year), new_entrant (families first appearing in FY2024+). Junk row pe_bli='9999999999' is filtered. Thresholds per recon §A."
    columns:
      - name: event_type
        data_tests: [not_null]
        description: "One of: yoy_swing, zeroed_fy2026, concentration_shift, new_entrant"
      - name: headline_value
        data_tests: [not_null]
        description: "Primary numeric value; semantics vary by event_type (fy2026_total for yoy_swing/zeroed; HHI for concentration_shift; total_obligation for new_entrant)"
      - name: comparison_value
        data_tests: [not_null]
        description: "Secondary numeric value for context (fy2025_total; 0; matched_dollars; first_fy as double)"
      - name: units
        data_tests: [not_null]
        description: "Unit label: thousands_usd | hhi_dollars | dollars"
  - name: fct_district_programs
    description: "High-confidence dollar grain per (pop_district, pe_bli). Only confidence='high' awards to avoid 14.7x multi-count fanout from medium rows. 267 rows, 106 districts, 17 programs (per recon §B). NOT summable at district grain — an award matched to N program elements appears N times with the same dollars; use fct_district_totals for the district headline (#51)."
    columns:
      - name: pop_district
        data_tests: [not_null]
      - name: pe_bli
        data_tests: [not_null]
      - name: total_obligation
        description: "Sum of all transaction obligations for this (district, program) combination. Positive and negative values possible (de-obligations)."
  - name: fct_district_totals
    description: "District HEADLINE grain (#51) — one row per (pop_state, pop_district), dollars counted once per distinct award. The sum-safe companion to fct_district_programs: that model is per (district, pe_bli) and an award matched to N program elements appears N times with the same dollars, so summing it double-counts (AK-00 measured 5.0x — one $209.3M DARPA award attributed whole to five program elements, publishing $1.05B). assert_district_totals_no_double_count pins every district total to the sum of its DISTINCT awards. Unique on (pop_state, pop_district) — NOT pop_district alone, which is not globally unique (a bare '90' MULTI-STATE/unknown-state code appears against more than one raw pop_state label)."
    columns:
      - name: pop_state
        data_tests: [not_null]
      - name: pop_district
        data_tests: [not_null]
      - name: award_count
        description: "count(distinct award_id_piid) contributing to this district's total — the number of distinct high-confidence-crosswalked awards, never a program-element count."
      - name: total_obligation
        description: "Sum of obligation dollars across this district's DISTINCT awards (never per program element). This is the figure /district/ publishes as 'linkable obligations' — do not re-derive it by summing fct_district_programs."
  - name: fct_family_obligations_by_year
    description: "Total obligations per (family_key, fiscal_year) via entity_xwalk. entity_xwalk is UNIQUE on recipient_uei — no fan-out. Covers 100.0% of total award dollars (the crosswalk spans the same contracts+assistance union). Expected ~457,243 rows; was ~365,457 / 94.2% while the crosswalk was stale (Task 5b)."
    columns:
      - name: family_key
        data_tests: [not_null]
      - name: fiscal_year
        data_tests: [not_null]
      - name: total_obligation
        description: "Sum of obligation values (can be negative due to de-obligations)"
  - name: fct_state_per_capita
    description: "Cross-jurisdiction cost-per-capita comparable for CA and CT. Grain: (jurisdiction, comparable_category, fiscal_year). Only rows where BOTH CA and CT have spend for the same (comparable_category, fiscal_year) are included."
    columns:
      - name: jurisdiction
        data_tests: [not_null]
      - name: comparable_category
        description: "Canonical category label from dbt/seeds/state_category_map.csv; maps jurisdiction-specific vocabulary to shared semantics. All CT grant lines (State Aid Grants, Trnsfr Grant Expend-St Agency, Pass thru Grant Non-State, GT Transfer-Grant-St Agencies, Student Grant & Aid-Undergrad, State Aid Grants-State Agency) roll into grants_and_subventions. All CT consulting lines (Management Consultant Services, IT Consultant Services variants, Environmental Consulting Servi, Insurance Consultant Services) roll into consulting_professional."
        data_tests: [not_null]
      - name: amount_per_capita
        description: "Derived: total_amount_usd / population. Population from US Census NST-EST2024 estimates."
      - name: coverage_note
        description: "Human-readable capture provenance note per jurisdiction row. CA: 'CA full Open Fi$Cal capture FY2025 (all departments from pointer manifest)'. CT: 'CT full checkbook via Socrata SoQL aggregate (data.ct.gov ajdm-rvz7)'. Populated from jurisdiction field at build time."
  - name: fct_flow_edges
    description: "Phase 5H flowdown edges at FULL grain (top-N/'Other' collapse happens at export time only). Two rivers: budget (FY2026 PB detail rows, title IS NOT NULL dedup rule, amount_type=fy_2026_total, USD thousands, hierarchy TOTAL→component→appropriation→budget_activity→program) and spend (DoD prime contract obligations per fiscal year, USD, TOTAL→sub_agency→office→family, split by competed_class and offers_bucket). Conservation + source-recompute guards live in tests/assert_flow_*.sql."
    columns:
      - name: river
        data_tests:
          - not_null
          - accepted_values:
              values: ['budget', 'spend']
      - name: fiscal_year
        data_tests: [not_null]
      - name: level_from
        data_tests:
          - not_null
          - accepted_values:
              values: ['total', 'component', 'appropriation', 'budget_activity', 'sub_agency', 'office']
      - name: node_from
        data_tests: [not_null]
      - name: level_to
        data_tests:
          - not_null
          - accepted_values:
              values: ['component', 'appropriation', 'budget_activity', 'program', 'sub_agency', 'office', 'family']
      - name: node_to
        data_tests: [not_null]
      - name: competed_class
        description: "4 honest classes for spend edges (full_and_open / set_aside / other_than_full / not_competed; NULL rows fold into not_competed — never flatters competition). NULL on budget edges: intent has no competition dimension."
        data_tests:
          - accepted_values:
              values: ['full_and_open', 'set_aside', 'other_than_full', 'not_competed']
      - name: offers_bucket
        description: "number_of_offers_received bucket ('1','2','3-4','5-9','10+','unknown'); NULL on budget edges."
        data_tests:
          - accepted_values:
              values: ['1', '2', '3-4', '5-9', '10+', 'unknown']
      - name: units
        description: "USD_thousands (budget river) | USD (spend river)"
        data_tests:
          - not_null
          - accepted_values:
              values: ['USD_thousands', 'USD']
  - name: fct_decade_series
    description: "Phase 5E edition-aware decade series. Grain: (pe_bli, fy, edition_year) — the edition-aware replacement for the PB2026-fenced dim_programs/dim_pe_titles surfaces (Task 5 binding (iii); the fences themselves are untouched). Scenario semantics are edition-relative (year-shift rule): PriorYear=FY(N-2) actuals, CurrentYear=FY(N-1) enacted, BudgetYearOne=FY(N) request for edition N. Values are USD thousands from R-1/P-1 display-workbook detail rows (source_document_id IS NOT NULL; P-1R reserve-component exhibit and the '9999999999' classified aggregate excluded); slugs picked per reconcile.scenario_map candidate priority; every emitted amount recomputes from the raw parquet lake under the verify-phase5e any-candidate rule, with P-1R rows excluded from both sides of the recompute (P-1R recompute correction, Task 5 improvements): P-1R is the reserve-component SUBSET of P-1 — P-1 is the inclusive total (workbook ground truth, e.g. Aircraft Procurement Army FY2024 = $3.321B from P-1 alone) — so the 993 modern (PB2024–PB2026) P-1 grains the naive P-1 + P-1R recompute withheld at first build now publish their P-1-only detail sums (58,075 → 59,068 rows); see assert_decade_series_p1r_published_grains.sql and assert_decade_series_no_p1r_contamination.sql. Book quirk (documented): 6 small-dollar grains carry P-1R > P-1 in the source workbooks (e.g. BLI 833040/3080F FY2023: P-1 13,986 vs P-1R 16,000) — the P-1 value is still published as the exhibit's inclusive total. PB2019 OSD dual-volume dedup (binding (i)) is satisfied by construction — this mart reads single-copy budget_lines, never jbook details; assert_decade_series_pb2019_osd_single_volume.sql guards belt-and-braces. Editions are parallel worlds: rows are never merged or reconciled across edition_year."
    columns:
      - name: pe_bli
        data_tests: [not_null]
        description: "Program element (R-1) or budget line item (modern P-1) identifier; era procurement rows carry within-edition namespaced keys ('{account}-{org}-L{line}')."
      - name: fy
        data_tests: [not_null]
        description: "Fiscal year the amount describes (edition_year - 2/1/0 for actuals/enacted/request)."
      - name: edition_year
        data_tests: [not_null]
        description: "PB edition that reports this amount (jbook_documents.fiscal_year). Part of the grain — editions are never merged."
      - name: amount_type_kind
        description: "Scenario class: actuals (PriorYear), enacted (CurrentYear — for CR-era editions the source column is the CR-adjusted analog, see amount_type), request (BudgetYearOne)."
        data_tests:
          - not_null
          - accepted_values:
              values: ['actuals', 'enacted', 'request']
      - name: amount
        data_tests: [not_null]
        description: "USD thousands; sum of the edition's detail rows under amount_type. Recomputes from the parquet lake (verify-phase5e leg d)."
      - name: amount_thousands
        data_tests: [not_null]
        description: "Alias of amount (explicit unit name for exporters)."
      - name: scenario
        data_tests: [not_null]
        description: "Source XML/reconciliation scenario name (PriorYear/CurrentYear/BudgetYearOne)."
      - name: amount_type
        data_tests: [not_null]
        description: "The picked source workbook column slug (e.g. fy_2024_actuals, fy_2017_total_pb_requests_with_cr_adj_base_oco) — preserves the exact per-edition header semantics."
      - name: n_source_rows
        data_tests: [not_null]
        description: "Number of detail rows aggregated (accounts/orgs/budget activities)."
      - name: source_fact_id
        description: "Task 6 fact-minting handoff: when n_source_rows=1, the workbook fact_id (export_site.fact_id_workbook derivation, sha256(...)[:16]) of the single source row; NULL for multi-row grains — the exporter joins (pe_bli, edition_year, amount_type) to its typed budget_lines rows to mint a derived sum fact with breakdown inputs."
  - name: fct_book_diff
    description: "Phase 5E cross-edition book diff. Grain: (pe_bli, from_edition, to_edition, diff_kind); values USD thousands; delta = to_value - from_value, both sides sourced from fct_decade_series (join-completeness by construction). diff_kind: request_vs_request compares PB(N) vs PB(N+1) BudgetYearOne (consecutive asks, FY N vs FY N+1); request_vs_actuals compares the PB(N) FY-N request against PB(N+2) FY-N actuals (the accountability diff; span always 2). COVERAGE: RDT&E R-1 program elements diff across ALL edition boundaries PB2017–PB2026 (PE numbers are stable identities). Procurement coverage is modern-only — P-1 BLI codes are stable identities only from PB2024, so procurement diffs exist for PB2024→PB2025, PB2025→PB2026 and PB2024→PB2026 boundaries only. Era (PB2017–PB2023) procurement is excluded ENTIRELY (Task 5 binding (ii)): its namespaced '{account}-{org}-L{line}' keys are within-edition identities — line renumbering makes both era-to-modern and within-era procurement diffs an honest gap, never a join (guard: assert_book_diff_no_era_procurement.sql)."
    columns:
      - name: pe_bli
        data_tests: [not_null]
      - name: from_edition
        data_tests: [not_null]
        description: "Earlier PB edition (its BudgetYearOne request is the from side)."
      - name: to_edition
        data_tests: [not_null]
        description: "Later PB edition (from_edition+1 for request_vs_request, from_edition+2 for request_vs_actuals)."
      - name: diff_kind
        data_tests:
          - not_null
          - accepted_values:
              values: ['request_vs_request', 'request_vs_actuals']
      - name: from_fy
        data_tests: [not_null]
        description: "Fiscal year of the from side (== from_edition; BudgetYearOne)."
      - name: to_fy
        data_tests: [not_null]
        description: "Fiscal year of the to side (to_edition for request_vs_request; == from_fy for request_vs_actuals)."
      - name: from_value
        data_tests: [not_null]
        description: "USD thousands; PB(from_edition) request for FY from_fy."
      - name: to_value
        data_tests: [not_null]
        description: "USD thousands; PB(to_edition) request (request_vs_request) or actuals (request_vs_actuals)."
      - name: delta
        data_tests: [not_null]
        description: "to_value - from_value, USD thousands (verify-phase5e leg c conservation)."
      - name: from_amount_type
        data_tests: [not_null]
        description: "Source workbook column slug of the from side (Task 6 fact-minting join key)."
      - name: to_amount_type
        data_tests: [not_null]
        description: "Source workbook column slug of the to side (Task 6 fact-minting join key)."
      - name: from_source_fact_id
        description: "Workbook fact_id of the from side when it aggregates a single source row; NULL otherwise (exporter mints a derived sum fact)."
      - name: to_source_fact_id
        description: "Workbook fact_id of the to side when single-source; NULL otherwise."
